{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-check-circle-fill text-success" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>
                    <h2 class="mb-3">Payment Successful!</h2>
                    <p class="mb-4">Your booking has been confirmed and payment has been processed successfully.</p>
                    <p class="text-muted mb-4">You can close this window and return to the app.</p>
                    
                    <div class="d-grid gap-2">
                        <button id="close-btn" class="btn btn-primary">Return to App</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // For mobile WebView to close the window when button is pressed
    document.getElementById('close-btn').addEventListener('click', function() {
        // This message will be intercepted by the mobile app
        window.postMessage('PAYMENT_SUCCESS', '*');
        
        // Fallback for browsers
        setTimeout(function() {
            window.close();
        }, 300);
    });
    
    // Also send the success message on page load
    window.addEventListener('load', function() {
        window.postMessage('PAYMENT_SUCCESS', '*');
    });
</script>
{% endblock %}
