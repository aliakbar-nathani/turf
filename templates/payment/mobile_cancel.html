{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <div class="mb-4">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-x-circle-fill text-danger" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM5.354 4.646a.5.5 0 1 0-.708.708L7.293 8l-2.647 2.646a.5.5 0 0 0 .708.708L8 8.707l2.646 2.647a.5.5 0 0 0 .708-.708L8.707 8l2.647-2.646a.5.5 0 0 0-.708-.708L8 7.293 5.354 4.646z"/>
                        </svg>
                    </div>
                    <h2 class="mb-3">Payment Cancelled</h2>
                    <p class="mb-4">Your payment process was cancelled. Your booking is still active but payment is required to confirm it.</p>
                    <p class="text-muted mb-4">You can close this window and return to the app.</p>
                    
                    <div class="d-grid gap-2">
                        <button id="close-btn" class="btn btn-primary">Return to App</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // For mobile WebView to close the window when button is pressed
    document.getElementById('close-btn').addEventListener('click', function() {
        // This message will be intercepted by the mobile app
        window.postMessage('PAYMENT_CANCELLED', '*');
        
        // Fallback for browsers
        setTimeout(function() {
            window.close();
        }, 300);
    });
    
    // Also send the cancel message on page load
    window.addEventListener('load', function() {
        window.postMessage('PAYMENT_CANCELLED', '*');
    });
</script>
{% endblock %}
